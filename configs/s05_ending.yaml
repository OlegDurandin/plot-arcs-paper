# Ворота 5, п. 2: подъём концовки волшебной сказки — развязка или финальная формула.
seed: 42
emotion_config: configs/s02_emotion.yaml
arcs_config: configs/s02_llm_arcs.yaml
nulls_config: configs/s04_nulls.yaml
out_dir: data/processed/s05/ending        # отдельная папка — отдельный бюджет LLM

# 2.1 контраст концовки без последнего сегмента (позиции 1-based, N = 20)
contrast:
  end_wo_last: [18, 19]
  end_last: [20]
  end_both: [19, 20]
  middle: [3, 17]            # включительно; без начала (1–2) и всей зоны концовки (18–20)
  bootstrap: 1000

# 2.2 разметка по предложениям (та же модель и инструкция; + 2 предыдущих предложения как контекст, не оцениваются)
api:
  temperature: 0
  max_tokens: 60
  reasoning: {enabled: false}
  workers: 16
  timeout_s: 120
  retries: 4
budget_rub: 100              # решение пользователя (Ворота 5, п. 2.2)
stop_at_rub: 95
models:
  main: deepseek-v4.1-flash
sample:
  last_segs: [19, 20]        # 1-based; последние 2 сегмента N20
  n_story: 100               # рассказы той же длины: пары «сказка — рассказ» по log(n_words) из выборки LLM-дуг
  caliper_log: 0.05
  context_sents: 2
  min_prefix_words: 4        # смешанное предложение «развязка + формула»: часть до формулы оценивается отдельно, если ≥ 4 слов
  rerate_last_segment: true  # сказки с формулой в последнем сегменте: последний сегмент без формулы — заново, как сегмент
cost_model: {a: 0.0080, b: 0.0000561}   # a чуть выше, чем у дуг: инструкция длиннее на строку контекста

# 2.3 финальные формулы. Список проверен глазами по последним 4 предложениям всех 179 сказок базы (2026-11-26).
# Формульный блок = от первого предложения с формулой среди последних tail_sents предложений текста до конца.
formulas:
  tail_sents: 4
  strict:                    # канонические концовки (рифмованные / закреплённые)
    - "жить[- ]?(да |и )?(по)?живать"
    - "жил[- ]пожив"
    - "живите себе, поживайте"
    - "(добра|добро|животы|добры мысли) (на|при)?(жив|пас|мать)"
    - "лиха (не знавать|избыва)"
    - "худо забыва"
    - "век доживать"
    - "не горевать"
    - "(я|мы|деды дедов) (там|тут|на свадьбе|не свадьбе|у гостях|сам)[^.]{0,30}(был|была|быв|бывал|были)"
    - "на (том|той) (пиру|свадьбе)[^.]{0,10}(и )?я"
    - "(м[её]д|вино|пиво)[- ,и]*(пиво|вино)?[- ]?(пил|пив|пила|пили|пить)"
    - "по (усам|усу|бороде|губам|бараде)[^.]{0,5}(текло|тякло)"
    - "в (рот|роте|роти) не (попало|было)|во рту (не было|сухо)"
    - "(теперь|тяперь|поныне|ныне) жив"
    - "хлеб (жу|жуе)"
    - "жить да быть"
    - "сказк[аеи][^.]{0,15}(конец|вся)|сказке конец|кончилась сказка|тем и сказка"
    - "(вот вам|вот тебе) сказка"
    - "бубликов"
  extended:                  # клише счастливого конца — второй уровень
    - "припеваючи"
    - "долго и счастливо|счастливо и долго"
    - "в (любви|согласии|тишине|радости|счастии|добре|совете)"
    - "во всяком (добре|благополучии|счастии)"
    - "(жил|жили|жить|живёт|царствовал\\w*|век свой)[^.;]{0,30}(благополучн|счастлив|долгие лета|долго)"
  editorial:                 # редакторские пометки — не текст сказки, исключаются из всех частей
    - "^\\s*[(:]"
    - "Записано в"
