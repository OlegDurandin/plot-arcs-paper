# Этап 0 — инвентаризация корпусов
seed: 42

# Доля выборки для пробного прогона (стабильный хеш по id, 0..1). 1.0 = полный корпус.
sample_frac: 0.02
out_dir: data/interim          # манифест: manifest[_sample<frac>].parquet
report_dir: reports
n_workers: 8
chunk_rows: 500                # строк из sqlite за один fetch

sources:
  fairytales:
    db: data/raw/fairytalez.sqlite
    # Поле author -> тип текста. Всё, что не перечислено, — фольклорный сборник (folk).
    fable_authors: ["Басни Эзопа", "фонтан"]          # «фонтан» = Лафонтен (машинный перевод)
    literary_authors: ["Ганс Христиан Андерсен", "Софи Сегюр", "Вильгельм Хауфф", "Оскар Уайльд",
      "Редьярд Киплинг", "Чарльз Кингсли", "Клемент С. Мур", "Ивана Брлич-Мажуранич", "Мадам Д'Онуа",
      "Александр Пушкин", "ЭТА Хоффманн", "Франсуа Коппе", "Натаниэль Хоторн", "Вашингтон Ирвинг",
      "Beatrix Potter", "Карл Сэндберг", "Charles Perrault", "Рэймонд Макдональд Олден", "Баронесса Орчи",
      "Эдуард Рене Лефевр де Лабуле", "Констанс Армфилд"]
  afanasyev:
    parquet: data/interim/afanasyev.parquet         # строится src/s00c_afanasyev.py
  proza:
    # Код рубрики Проза.ру -> форма
    topic_to_form: {"02": story, "21": novella, "01": povest, "04": novel}
    dbs:
      - data/raw/proza[2018].sqlite
      - data/raw/proza[2019].sqlite
      - data/raw/proza[2020-2021].sqlite
      - data/raw/proza[2022-2023].sqlite
      - data/raw/proza[2024-2025].sqlite
      - data/raw/proza[2023,novel].sqlite
      - data/raw/proza[2023,novella].sqlite
      - data/raw/proza[2023,povest].sqlite
      - data/raw/proza[2024,novel].sqlite
      - data/raw/proza[2024,novella].sqlite
      - data/raw/proza[2024,povest].sqlite
      - data/raw/proza[2025,novel].sqlite
      - data/raw/proza[2025,novella].sqlite
      - data/raw/proza[2025,povest].sqlite
  ficbook:
    # распаковано из data/raw/data_ficbook(24.11).zip (без __MACOSX)
    base: data/interim/ficbook_raw
    db: data/interim/ficbook_raw/data_ficbook/ficbook_originals_2026.sqlite
    old_db: data/interim/ficbook_raw/data_ficbook/ficbook.sqlite   # только метаданные, для сверки

dedup:
  shingle_words: 5
  num_perm: 128
  jaccard_threshold: 0.8
  lsh_bands: 16                # 16 x 8 строк; кандидаты затем проверяются по оценке Жаккара
  max_bucket: 200              # бакеты LSH крупнее — пропускаются (шаблонные тексты), число логируется
  min_words: 20                # тексты короче не участвуют в near-dup

completeness:
  tail_chars: 400               # в каком хвосте текста искать «продолжение следует» / «конец»

verse:
  # строка «короткая», если в ней <= short_line_words слов; текст «похож на стихи», если доля таких строк >= share
  short_line_words: 8
  min_lines: 8
  share: 0.7

# Этап 0b — склейка глав Проза.ру в произведения (src/s00b_link_proza.py)
proza_linking:
  forms: [novel, povest]          # серии, в которых есть хотя бы одна запись этих рубрик
  include_forms: [story, novella, novel, povest]   # записи каких рубрик могут входить в серию
  stem_words: 3                   # основа заголовка — первые k слов после удаления маркеров глав
  min_stem_chars: 3
  min_records: 3
  max_chapter_number: 500         # большие «номера» — это годы, суммы и т.п.
  order_rank_corr_min: 0.9        # Spearman(номер главы, время публикации) для «согласованного порядка»
  review_n: 50                    # серий для ручной проверки

# Этап 0c — корпус Афанасьева (src/s00c_afanasyev.py)
afanasyev:
  api: https://ru.wikisource.org/w/api.php
  prefix: "Народные русские сказки (Афанасьев)/"
  user_agent: research-corpus-builder/0.1
  raw_dir: data/external/afanasyev        # скачанная вики-разметка (после скачивания — только чтение)
  batch: 50
  out: data/interim/afanasyev.parquet

# Этап 0d — аналитическая выборка по решениям Ворот 0 (src/s00d_select.py)
selection:
  min_words: 600                 # единый порог для всех форм (Ворота 0)
  exclude_verse_like: true
  # Лимит в выборках: не больше 20 единиц на (автор, форма, единица). Отбор СЛУЧАЙНЫЙ с seed (верхний уровень),
  # а не первые 20 по дате: author_rank — ранг по случайному ключу numpy.default_rng(seed); берём author_rank < 20.
  max_per_author_form: 20
  afanasyev_langs: [ru]          # украинские/белорусские варианты — вне базы
  afanasyev_exclude_types: [bylichka]   # былички — несказочная проза, вне любой базы
  afanasyev_base_types: [magic]         # основная база (base_magic600); все остальные типы — base_all600 (устойчивость)
  explicit_max_per_author: 3            # набор explicit (проверка концовок): ≤ 3 на автора, случайно (seed)
  fairytales_kinds: [folk]       # басни и литературные сказки — вне базы
  ficbook: {originals_only: true, status: finished, no_missing_chapters: true}
  # заголовок-фрагмент: запись — часть большего текста (строже, чем диагностический CHAPTER_RE)
  fragment_title_re: '(?i)(?<!\w)(?:глава|главы|гл\.|часть|части|ч\.\s*\d|продолжение|окончание|эпизод|серия|пролог|эпилог|отрывок|фрагмент)(?!\w)'
  linked_works: linked_ok        # какие склеенные серии брать: linked_ok или complete_marked
  # Ворота 0, п.1: повесть/роман одной записью — только от порога; короче -> глава (unit=chapter, в склейку).
  # Эти же пороги задают форму склеенной серии по её суммарной длине.
  long_form_min_words: {povest: 10000, novel: 20000}
  long_form_strict_min_words: {povest: 15000, novel: 40000}   # проверка устойчивости (RQ1, RQ2)
  min_words_sensitivity: {afanasyev: 400}                      # Ворота 0, п.3: проверка чувствительности базы
  out: data/interim/analysis_set.parquet

# Этап 0d — типы сказок Афанасьева
# Нумерация — трёхтомник «Наука» 1984–1985 (Викитека ссылается на него), порядок жанровый.
# Тип задаётся по разделу указателя ATU (а не по позиции в издании):
#   animal   — сказки о животных, ATU 1–299 (кумулятивные о животных — «Колобок», «Репка», «Терем мухи» — здесь же);
#   magic    — волшебные, ATU 300–749;
#   heroic   — богатырские / пересказы былин (Илья Муромец, Василий Буславич, Алёша Попович, Мамай…): не волшебная
#              сказка в смысле Проппа — вне основной базы, в проверке устойчивости;
#   legend   — легендарные (ATU 750–849) и этиологические;
#   novella  — бытовые (новеллистические), ATU 850–999 и 1000–1199 «о глупом чёрте»;
#   anecdote — анекдоты и небылицы, ATU 1200–1999;
#   formula  — докучные сказки, прибаутки, цепочки, ATU 2000–2399;
#   bylichka — былички: несказочная проза (рассказчики верят в достоверность) — вне любой базы.
# Разметка — агентом по ATU-сюжетам, известным по названию/началу текста; спорные места — в experiment_results.md.
afanasyev_types:
  animal:   [[1, 74], [77, 90], [554, 556]]
  magic:    [[75, 76], [92, 93], [95, 301], [303, 304], [313, 314], [348, 350], [363, 364], [375, 377],
             [557, 563], [566, 571], [573, 575], [578, 578]]
  heroic:   [[308, 312], [315, 315], [317, 317]]
  legend:   [[91, 91], [94, 94], [318, 318], [370, 371]]
  novella:  [[302, 302], [305, 307], [316, 316], [321, 347], [372, 372], [429, 429], [572, 572]]
  anecdote: [[319, 320], [378, 411], [418, 428], [430, 527], [564, 565], [576, 576], [579, 579]]
  formula:  [[412, 417], [528, 553]]
  bylichka: [[351, 362], [365, 369], [373, 374], [577, 577]]
