# [УСТАРЕЛО — batch1_v1 (120 текстов на группу, 1 фрагмент середины), НЕ ОТДАВАТЬ; заменено configs/s02_students.yaml, 2026-11-26]
# Ворота 5, п. 3 (2026-11-26): партия 1 для студентов — проверка подъёма концовки сказки человеком.
# Критерий — контраст внутри текста: (концовка − середина) у сказок больше, чем у рассказов той же длины;
# 95 % ДИ разницы (бутстрэп по текстам) не включает 0. Правило (б) «LLM + человек» принято 2026-11-25 ДО разметки.
seed: 42
emotion_config: configs/s02_emotion.yaml
arcs_config: configs/s02_llm_arcs.yaml
out_dir: data/processed/s02/students
key_file: batch1_v1_key.parquet
page_index: reports/02_students_batch1_v1.html          # инструкция + ссылки на страницы разметчиков
page_annotator: reports/02_students_batch1_v1_{a}.html
storage_key: students_batch1_v2_{a}                  # отдельный ключ localStorage на разметчика
groups: [afanasyev, story]                           # сказки базы и рассказы той же длины (выборка LLM-дуг)
end_seg: 20                                          # 1-based: последний сегмент N20 — там основной эффект
n_mid: 1
n_fixed: 120
power_report: reports/02_students_power_v1.md
decision: "batch1_v1 — устарело, не отдавать."
middle_segs: [6, 15]                                 # 1-based, включительно: один случайный сегмент из середины
power:
  n_grid: [40, 60, 80, 100, 120, 140]                # текстов на группу; 120, 140 — добавлены 2026-11-26: при 100 мощность ≈ 0,89 < 0,9
  n_sim: 1000
  n_boot: 1000
  target: 0.90
  # проверка чувствительности (не для выбора n): человек шумнее LLM — к каждой оценке добавляется N(0, σ²),
  # с округлением и обрезкой до −2…+2
  noise_sd: [0.5, 1.0]
  alt_n_mid: 2              # для сравнения (не для выбора n): 2 фрагмента середины на текст вместо одного
annotators: [A, B]
overlap_frac: 0.30                                   # доля текстов (оба фрагмента), которые размечают оба
n_repeats: 10                                        # скрытые повторы на разметчика
repeat_min_gap: 30
pair_min_gap: 10                                     # фрагменты одного текста — не ближе 10 позиций друг к другу
time_model:                                          # для оценки времени разметки
  words_per_min: 150                                 # внимательное чтение художественного текста
  sec_per_item: 20                                   # выбор тональности и эмоции
