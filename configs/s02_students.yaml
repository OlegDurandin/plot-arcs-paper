# Ворота 2/5: партия 1 для студентов — проверка разницы концовок и начал «сказка vs рассказ» человеком.
# Правило (б) «LLM + человек» для концовок принято 2026-11-25 ДО человеческой разметки.
seed: 42
emotion_config: configs/s02_emotion.yaml
arcs_config: configs/s02_llm_arcs.yaml
out_dir: data/processed/s02/students
page: reports/02_students_batch1.html
storage_key: students_batch1_v1        # отдельный ключ localStorage — не смешивается с золотом
batch:
  # фрагмент = 2 сегмента N20 подряд, целиком (сказки базы и рассказы той же длины из выборки LLM-дуг)
  endings: {afanasyev: 30, story: 30}  # последние 2 сегмента (19–20)
  beginnings: {afanasyev: 15, story: 15}  # первые 2 сегмента (1–2); другие тексты, чем концовки
  # результат о начале — относительно середины своего текста (z-дуга), поэтому к каждому тексту с началом
  # добавляется фрагмент из середины (сегменты 10–11); без него человек проверит только абсолютный уровень
  beginnings_with_middle: true
  middle_segs: [9, 10]
  n_repeats: 10                         # скрытые повторы для согласия разметчика с собой
  repeat_min_gap: 30
  repeat_source_max: 60
